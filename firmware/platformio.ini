; PlatformIO 로 빌드할 때 사용하는 설정 파일.
; Arduino IDE 만 쓸 거면 이 파일은 무시해도 됩니다.
;
; 사용법:
;   1) VS Code + PlatformIO 확장 설치
;   2) 이 firmware 폴더를 열기
;   3) smart_trash_esp32/smart_trash_esp32.ino 를 src/main.cpp 로 두거나
;      src_dir 를 아래처럼 지정
;   4) 빌드 & 업로드

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_dir = smart_trash_esp32
lib_deps =
    bogde/HX711 @ ^0.7.5
